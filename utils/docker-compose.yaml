version: '3.9'

services:
  postgres:
    image: postgres:16.2
    ports:
      - 5432:5432
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=postgres
      - POSTGRES_DB=prm
volumes:
  prm_data:
    driver: local
    driver_opts:
      type: none
      device: /data/db_data
      o: bind