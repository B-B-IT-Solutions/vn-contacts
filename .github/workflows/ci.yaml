name: CI/CD Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: prm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      keycloak:
        image: quay.io/keycloak/keycloak:24.0.2
        ports:
          - 8090:8080
        env:
          KC_DB: postgres
          KC_DB_USERNAME: postgres
          KC_DB_PASSWORD: test
          KC_DB_URL: "jdbc:postgresql://postgres:5432/prm"
          KC_METRICS_ENABLED: true
          KC_LOG_LEVEL: INFO
          KC_REALM_NAME: prm
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: test
    #        volumes:
    #          - ${{github.workspace}}/utils/keycloak/realm.json:/opt/keycloak/data/import/realm.json
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Keycloak Admin CLI
        uses: carlosthe19916/keycloak-action@0.4
        with:
          server: http://keycloak:8090
          realm: master
          client: prm
          username: admin
          password: test
          server-wait-timeout: 30
          kcadm: create realms -f ./utils/keycloak/realm.json
      - name: Set up JDK 19
        uses: actions/setup-java@v2
        with:
          java-version: '19'
          distribution: 'adopt'
      - name: Run Tests
        run: mvn clean compile verify