name: CI/CD Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.2
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: postgres
          POSTGRES_DB: prm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      keycloak:
        image: quay.io/keycloak/keycloak:24.0.2
        ports:
          - 8080:8080
        env:
          KC_DB: postgres
          KC_DB_USERNAME: postgres
          KC_DB_PASSWORD: test
          KC_DB_URL: "jdbc:postgresql://postgres:5432/prm"
          KC_REALM_NAME: prm
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: test
          options: >-
            --health-cmd "curl -f http://localhost:8080/auth/realms/master"
            --health-interval 30s
            --health-timeout 10s
            --health-retries 5
    steps:
      - name: Keycloak logs
        if: always()
        run: docker logs "${{job.services.keycloak.id}}"
      - name: Checkout Code
        uses: actions/checkout@v4
      #      - run: apt-get update; apt-get install curl -y
      #      - run: curl --output /dev/null --head http://keycloak:8080/auth
      #      - name: Keycloak Admin CLI
      #        uses: carlosthe19916/keycloak-action@0.4
      #        with:
      #          server: http://keycloak:8080/auth
      #          realm: master
      #          client: admin-cli
      #          username: admin
      #          password: test
      #          server-wait-timeout: 30
      #          kcadm: create realms -f ./utils/keycloak/realm.json
      - name: Set up JDK 19
        uses: actions/setup-java@v2
        with:
          java-version: '19'
          distribution: 'adopt'
      - name: Run Tests
        run: mvn clean compile verify